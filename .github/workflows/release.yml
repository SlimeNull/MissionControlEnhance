name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        env:
          ARCH: ${{ matrix.arch }}
          SIGN_IDENTITY: "-"
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: build/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.dmg"
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
